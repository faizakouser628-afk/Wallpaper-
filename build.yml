name: Build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.7}
      - name: Make project
        run: |
          mkdir -p app/src/main/java/com/wp/luffyzoro app/src/main/res/xml app/src/main/assets
          cp index.html app/src/main/assets/index.html
          echo "pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}
          dependencyResolutionManagement{repositories{google();mavenCentral()}}
          include ':app'" > settings.gradle
          echo "plugins{id 'com.android.application' version '8.5.2' apply false}" > build.gradle
          echo "android.useAndroidX=true" > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins{id 'com.android.application'}
          android{namespace 'com.wp.luffyzoro'
          compileSdk 34
          defaultConfig{applicationId 'com.wp.luffyzoro';minSdk 24;targetSdk 34;versionCode 1;versionName '1.0'}
          compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17}}
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-feature android:name="android.software.live_wallpaper" android:required="true"/>
          <application android:label="Luffy Zoro Wallpaper">
          <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
          <service android:name=".WebWallpaperService" android:exported="true" android:permission="android.permission.BIND_WALLPAPER"><intent-filter><action android:name="android.service.wallpaper.WallpaperService"/></intent-filter><meta-data android:name="android.service.wallpaper" android:resource="@xml/wallpaper"/></service>
          </application></manifest>
          EOF
          echo '<wallpaper xmlns:android="http://schemas.android.com/apk/res/android"/>' > app/src/main/res/xml/wallpaper.xml
          cat > app/src/main/java/com/wp/luffyzoro/MainActivity.java <<'EOF'
          package com.wp.luffyzoro;
          import android.app.Activity;
          import android.app.WallpaperManager;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.os.Bundle;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              Intent i = new Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER);
              i.putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT, new ComponentName(this, WebWallpaperService.class));
              startActivity(i);
              finish();
            }
          }
          EOF
          cat > app/src/main/java/com/wp/luffyzoro/WebWallpaperService.java <<'EOF'
          package com.wp.luffyzoro;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.os.Handler;
          import android.os.Looper;
          import android.service.wallpaper.WallpaperService;
          import android.view.MotionEvent;
          import android.view.SurfaceHolder;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          public class WebWallpaperService extends WallpaperService {
            public Engine onCreateEngine() { return new E(); }
            class E extends Engine {
              WebView w;
              Handler h = new Handler(Looper.getMainLooper());
              boolean vis;
              Runnable r = new Runnable() { public void run() { draw(); if (vis) h.postDelayed(this, 33); } };
              public void onCreate(SurfaceHolder s) {
                super.onCreate(s);
                setTouchEventsEnabled(true);
                w = new WebView(WebWallpaperService.this);
                WebSettings st = w.getSettings();
                st.setJavaScriptEnabled(true);
                st.setDomStorageEnabled(true);
                w.setBackgroundColor(Color.BLACK);
                w.loadUrl("file:///android_asset/index.html");
              }
              public void onSurfaceChanged(SurfaceHolder s, int f, int W, int H) {
                w.measure(View.MeasureSpec.makeMeasureSpec(W, View.MeasureSpec.EXACTLY), View.MeasureSpec.makeMeasureSpec(H, View.MeasureSpec.EXACTLY));
                w.layout(0, 0, W, H);
              }
              public void onVisibilityChanged(boolean v) {
                vis = v;
                if (v) { w.onResume(); h.post(r); } else { w.onPause(); h.removeCallbacks(r); }
              }
              public void onTouchEvent(MotionEvent e) { w.dispatchTouchEvent(e); }
              void draw() {
                SurfaceHolder s = getSurfaceHolder();
                Canvas c = null;
                try { c = s.lockCanvas(); if (c != null) w.draw(c); } catch (Exception x) {} finally { if (c != null) s.unlockCanvasAndPost(c); }
              }
              public void onDestroy() { vis = false; h.removeCallbacks(r); w.destroy(); super.onDestroy(); }
            }
          }
          EOF
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LuffyZoro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
